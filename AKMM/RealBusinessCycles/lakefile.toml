name = "AKMMRealBusinessCycles"
version = "0.1.0"
keywords = ["math", "economics", "macroeconomics"]
defaultTargets = ["AKMMRealBusinessCycles"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"
[[require]]
name = "NeoclassicalGrowth"
path = "../../EconomicDynamics/NeoclassicalGrowth"

[[require]]
name = "AKMMLaborSupply"
path = "../LaborSupply"

[[require]]
name = "AKMMUncertainty"
path = "../Uncertainty"

[[lean_lib]]
name = "AKMMRealBusinessCycles"
