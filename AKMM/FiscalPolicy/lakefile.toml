name = "AKMMFiscalPolicy"
version = "0.1.0"
keywords = ["math", "economics", "macroeconomics"]
defaultTargets = ["AKMMFiscalPolicy"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"
[[require]]
name = "LifeCycleFiscalPolicy"
git = "https://github.com/LeanEconomics/InternationalEconomics.git"
rev = "8dd8e672a5823910a34dcfa8e8893d7e8a4d06ad"
subDir = "LifeCycleFiscalPolicy"

[[require]]
name = "FiscalConstraints"
git = "https://github.com/LeanEconomics/MonetaryEconomics.git"
rev = "cd1aabd528ca45cb1a778cb5644319740bebd42f"
subDir = "Cochrane/FiscalConstraints"

[[lean_lib]]
name = "AKMMFiscalPolicy"
