name = "AKMMConsumption"
version = "0.1.0"
keywords = ["math", "economics", "macroeconomics"]
defaultTargets = ["AKMMConsumption"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

[[require]]
name = "CompleteMarkets"
path = "../../EconomicDynamics/CompleteMarkets"

[[require]]
name = "RationalExpectations"
path = "../../EconomicDynamics/RationalExpectations"

[[require]]
name = "IncompleteMarkets"
path = "../../EconomicDynamics/IncompleteMarkets"

[[require]]
name = "WeakConvergence"
path = "../../RecursiveMethods/WeakConvergence"

[[require]]
name = "AKMMCompetitiveEquilibrium"
path = "../CompetitiveEquilibrium"

[[require]]
name = "AKMMUncertainty"
path = "../Uncertainty"

[[require]]
name = "LeanEconomics"
git = "https://github.com/LeanEconomics/LeanEconomics.git"
rev = "8295256bbd64ab488c8cb436d68e7064db560dfc"

[[lean_lib]]
name = "AKMMConsumption"
