name = "AKMMQuantitativeMethods"
version = "0.1.0"
keywords = ["math", "economics", "macroeconomics"]
defaultTargets = ["AKMMQuantitativeMethods"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"


[[require]]
name = "RationalExpectations"
path = "../../EconomicDynamics/RationalExpectations"

[[require]]
name = "PartialInformation"
path = "../../EconomicDynamics/PartialInformation"

[[require]]
name = "StructuralEstimation"
path = "../../EconomicDynamics/StructuralEstimation"

[[require]]
name = "NeoclassicalGrowth"
path = "../../EconomicDynamics/NeoclassicalGrowth"

[[lean_lib]]
name = "AKMMQuantitativeMethods"
