name = "AKMMComputationalTools"
version = "0.1.0"
keywords = ["math", "economics", "macroeconomics"]
defaultTargets = ["AKMMComputationalTools"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"

[[require]]
name = "NumericalMethods"
path = "../../EconomicDynamics/NumericalMethods"

[[require]]
name = "DifferenceEquations"
path = "../../EconomicDynamics/DifferenceEquations"

[[require]]
name = "RationalExpectations"
path = "../../EconomicDynamics/RationalExpectations"


[[require]]
name = "JobSearch"
path = "../../FiniteStates/JobSearch"



[[lean_lib]]
name = "AKMMComputationalTools"
