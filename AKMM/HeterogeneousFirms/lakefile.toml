name = "AKMMHeterogeneousFirms"
version = "0.1.0"
keywords = ["math", "economics", "macroeconomics"]
defaultTargets = ["AKMMHeterogeneousFirms"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"
[[require]]
name = "ParetoOptimaEquilibria"
path = "../../RecursiveMethods/ParetoOptimaEquilibria"

[[require]]
name = "NewKeynesian"
path = "../../EconomicDynamics/NewKeynesian"

[[require]]
name = "AKMMGrowth"
path = "../Growth"

[[lean_lib]]
name = "AKMMHeterogeneousFirms"
