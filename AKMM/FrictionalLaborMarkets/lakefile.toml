name = "AKMMFrictionalLaborMarkets"
version = "0.1.0"
keywords = ["math", "economics", "macroeconomics"]
defaultTargets = ["AKMMFrictionalLaborMarkets"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"
[[require]]
name = "SearchAndMatching"
path = "../../EconomicDynamics/SearchAndMatching"

[[require]]
name = "Applications"
path = "../../EconomicDynamics/Applications"

[[require]]
name = "AdditionalApplications"
path = "../../GeneralStates/AdditionalApplications"

[[require]]
name = "OperatorsFixedPoints"
path = "../../FiniteStates/OperatorsFixedPoints"

[[lean_lib]]
name = "AKMMFrictionalLaborMarkets"
