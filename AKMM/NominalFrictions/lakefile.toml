name = "AKMMNominalFrictions"
version = "0.1.0"
keywords = ["math", "economics", "macroeconomics"]
defaultTargets = ["AKMMNominalFrictions"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.0"
[[require]]
name = "NewKeynesian"
path = "../../EconomicDynamics/NewKeynesian"

[[require]]
name = "BasicNewKeynesianModel"
git = "https://github.com/LeanEconomics/MonetaryEconomics.git"
rev = "cd1aabd528ca45cb1a778cb5644319740bebd42f"
subDir = "Gali/BasicNewKeynesianModel"

[[require]]
name = "MonetaryPolicyDesign"
git = "https://github.com/LeanEconomics/MonetaryEconomics.git"
rev = "cd1aabd528ca45cb1a778cb5644319740bebd42f"
subDir = "Gali/MonetaryPolicyDesign"

[[require]]
name = "DiscretionCommitment"
git = "https://github.com/LeanEconomics/MonetaryEconomics.git"
rev = "cd1aabd528ca45cb1a778cb5644319740bebd42f"
subDir = "Gali/DiscretionCommitment"

[[require]]
name = "StickyWagesPrices"
git = "https://github.com/LeanEconomics/MonetaryEconomics.git"
rev = "cd1aabd528ca45cb1a778cb5644319740bebd42f"
subDir = "Gali/StickyWagesPrices"

[[lean_lib]]
name = "AKMMNominalFrictions"
