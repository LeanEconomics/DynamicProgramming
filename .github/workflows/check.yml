# SPDX-License-Identifier: Apache-2.0
name: Check dynamic programming proofs
on: [push, pull_request]
permissions:
  contents: read
jobs:
  proofs:
    name: ${{ matrix.project }} proofs
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        project: [FiniteStates/JobSearch, FiniteStates/OperatorsFixedPoints, FiniteStates/MarkovDynamics, FiniteStates/OptimalStopping, FiniteStates/MarkovDecisionProcesses, FiniteStates/StochasticDiscounting, FiniteStates/NonlinearValuation, FiniteStates/RecursiveDecisionProcesses, FiniteStates/AbstractDynamicProgramming, FiniteStates/ContinuousTime, GeneralStates/PreludeExamples, GeneralStates/AbstractDecisionProcesses, GeneralStates/ADPsOnPospaces, GeneralStates/ADPsOnBanachSpace, GeneralStates/ADPTransformations]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned elan
        run: |
          curl --fail --location https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz -o elan.tar.gz
          tar xzf elan.tar.gz
          ./elan-init -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned mathematical dependencies
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          config = json.loads(Path('proof-manifest.json').read_text())
          imports = {line.removeprefix('import ') for name in config['modules']
                     for line in Path(name).read_text().splitlines()
                     if line.startswith('import Mathlib.')}
          subprocess.run(['lake', 'exe', 'cache', 'get', *sorted(imports)], check=True)
          PY
      - name: Test verification failure paths
        if: ${{ hashFiles(format('{0}/scripts/test_*.py', matrix.project)) != '' }}
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build and audit every proof
        run: python scripts/verify.py
